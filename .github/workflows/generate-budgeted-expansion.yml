name: Generate budgeted 2025 and 2026 expansion

on:
  workflow_dispatch:
    inputs:
      batches:
        description: Number of 12-item batches (1 for the first sample)
        type: number
        default: 1
      call_limit:
        description: Maximum items per batch
        type: number
        default: 2

permissions:
  contents: write

concurrency:
  group: budgeted-expansion
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and save batches
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ secrets.PARATERA_BASE_URL }}
          BATCHES: ${{ inputs.batches }}
          RESEARCH_CALL_LIMIT: ${{ inputs.call_limit }}
        run: |
          git config user.name 'earnings-database-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for batch in $(seq 1 "$BATCHES"); do
            python -u research-tools/generate_budgeted.py
            python research-tools/build_expansion_index.py
            git add database/ data/generation_budget_2025_2026.json RESEARCH_EXPANSION_INDEX.md
            git diff --cached --quiet || git commit -m "research: 2025-2026 budgeted batch $batch"
            git pull --rebase origin main
            git push
          done
