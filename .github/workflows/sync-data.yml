name: Sync earnings data

on:
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * 1-5'
    - cron: '37 13 * * 1-5'
    - cron: '37 1 * * 0,6'

permissions:
  contents: write

concurrency:
  group: earnings-database-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh calendar, market and macro data
        run: |
          python backend/sync_mag7_calendar.py
          python backend/sync_market_data.py
          python backend/sync_macro_events.py
      - name: Refresh Microsoft source-grounded research
        env:
          MSFT_RESEARCH_CALL_LIMIT: '0'
        run: python backend/sync_msft_research.py
      - name: Refresh Mag 7 research cache
        run: python backend/sync_mag7_research.py
      - name: Collect official quarterly filings
        run: python research-tools/collect_sec_quarters.py
      - name: Collect curated international releases
        run: python research-tools/collect_ir_quarters.py
      - name: Discover new international issuer releases
        run: python research-tools/discover_ir_releases.py
      - name: Generate new quarterly drafts within lifetime budget
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ secrets.PARATERA_BASE_URL }}
          RESEARCH_CALL_LIMIT: '4'
        run: python research-tools/generate_budgeted.py
      - name: Rebuild quarterly file index
        run: python backend/build_library_index.py
      - name: Audit HTML research history
        run: python backend/audit_html_coverage.py
      - name: Commit public data changes
        run: |
          git config user.name 'earnings-database-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ database/ RESEARCH_EXPANSION_INDEX.md
          git diff --cached --quiet || git commit -m 'data: refresh earnings snapshot'
          git push
