name: Check Paratera connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify configured model responds
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ secrets.PARATERA_BASE_URL }}
          PARATERA_MODEL: ${{ secrets.PARATERA_MODEL }}
        run: python check_paratera.py
