name: Generate quarterly research drafts

on:
  workflow_dispatch:
    inputs:
      call_limit:
        description: Maximum model calls this run
        type: number
        default: 2
      batch_all:
        description: Process all eligible stages in saved batches
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quarterly-research
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from source packets
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ secrets.PARATERA_BASE_URL }}
          PARATERA_MODEL: ${{ secrets.PARATERA_MODEL }}
          RESEARCH_CALL_LIMIT: ${{ inputs.call_limit || '3' }}
          RESEARCH_FAIL_ON_ERROR: '0'
          BATCH_ALL: ${{ inputs.batch_all }}
        run: |
          git config user.name 'earnings-database-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ "$BATCH_ALL" = 'true' ]; then
            offsets=$(seq 0 5 95)
          else
            offsets=0
          fi
          for offset in $offsets; do
            export RESEARCH_START_AFTER="$offset"
            if [ "$BATCH_ALL" = 'true' ]; then export RESEARCH_CALL_LIMIT=5; fi
            python -u research-tools/research_pipeline.py
            git add database/ data/research_index.json
            git diff --cached --quiet || git commit -m "research: refresh quarterly drafts batch $offset"
            git pull --rebase origin main
            git push
          done
